name: Robot CASHBET

on:
  schedule:
    - cron: "17 * * * *"   # cada hora (GitHub a veces se salta turnos; solo corre desde la rama por defecto: main)
  workflow_dispatch:          # botón "Run workflow"
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: robot
  cancel-in-progress: false

jobs:
  robot:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4

      - name: Traer los datos guardados (rama datos)
        run: |
          if git ls-remote --exit-code --heads origin datos >/dev/null; then
            git clone --depth 1 --branch datos "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" data
            rm -rf data/.git
          else
            mkdir -p data
          fi

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Descifrar el historial privado (si falla, el robot se detiene para no empezar un registro nuevo)
        env:
          ROBOT_PASS: ${{ secrets.ROBOT_PASS }}
        run: |
          pip install -q cryptography
          python robot/privado.py descifrar data

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Bajar partidos, cuotas y líneas de jugadores
        working-directory: robot
        run: |
          python fetch.py
          python props.py || echo "props falló, se sigue"
          python detail.py || echo "detalle falló, se sigue"

      - name: Prueba de acierto (una vez al día o si falta)
        working-directory: robot
        run: |
          # una vez al día: la primera corrida desde las 08 UTC (3 a. m. Colombia) que aún no lo hizo hoy
          # (antes solo si arrancaba justo a las 08: si GitHub se saltaba ese turno, no se hacía ese día)
          HOY=$(date -u +%F); NUEVO=0
          if [ ! -f ../data/model/report.json ]; then NUEVO=1
          elif [ "$(date -u +%H)" -ge 8 ] && [ "$(python -c "import json; print(json.load(open('../data/model/report.json'))['fecha'])")" != "$HOY" ]; then NUEVO=1; fi
          if [ "$NUEVO" = 1 ]; then python model.py > /dev/null; fi
          if [ "$NUEVO" = 1 ] || [ ! -f ../data/model/extra.json ] || ! python -c "import json,sys,extra; sys.exit(0 if json.load(open('../data/model/extra.json')).get('cuota_min') == extra.CUOTA_MIN else 1)"; then python -W ignore extra.py; fi

      - name: Validación del objetivo 70 % (solo lee el registro; decide qué tipos de pick se muestran)
        working-directory: robot
        run: python evaluar.py || echo "evaluar falló; sin validación no se muestra ningún pick"

      - name: Pronósticos
        working-directory: robot
        run: python predict.py

      - name: Motor de candidatos (solo lee; embudo, motivos de descarte y ranking -> data/model/candidatos.json)
        working-directory: robot
        run: python candidatos.py || echo "candidatos falló, se sigue"

      - name: Noticias (ESPN en español)
        working-directory: robot
        run: python noticias.py || echo "noticias falló, se sigue"

      - name: Resultados (en vivo y terminados)
        working-directory: robot
        run: python resultados.py || echo "resultados falló, se sigue"

      - name: Previa (récords, estadísticas, líderes, rotación)
        working-directory: robot
        run: python previa.py || echo "previa falló, se sigue"

      - name: Odds Intelligence (comparar casas con The Odds API; respeta el límite de créditos del mes; lee bajas y resultados)
        working-directory: robot
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: python odds.py || echo "odds falló, se sigue"

      - name: Notificaciones push (picks del día, errores de cuota, resultados de seguidos)
        working-directory: robot
        env:
          VAPID_PRIVATE: ${{ secrets.VAPID_PRIVATE }}
          ROBOT_PASS: ${{ secrets.ROBOT_PASS }}
        run: python avisos.py || echo "avisos falló, se sigue"

      - name: Sellar el registro (rama sellos, CON historial) y verificarlo contra todos los sellos anteriores
        run: |
          URL="https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git"
          if git ls-remote --exit-code --heads origin sellos >/dev/null; then
            git clone -q --branch sellos "$URL" sellos
          else
            mkdir sellos && git -C sellos init -q -b sellos
          fi
          if [ -f sellos/sellos.txt ]; then (cd robot && python verificar.py ../data/ledger.json ../sellos/sellos.txt); fi
          python robot/sellar.py data sellos
          cp robot/registro.py robot/verificar.py sellos/
          cd sellos
          git config user.name "robot-cashbet"
          git config user.email "robot-cashbet@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -q -m "sello $(date -u +%Y-%m-%dT%H:%MZ)"
          git push -q "$URL" sellos

      - name: Subir el historial privado a Firebase (solo lo lee la cuenta admin)
        env:
          ROBOT_PASS: ${{ secrets.ROBOT_PASS }}
        run: python robot/privado.py subir || echo "subir el historial privado falló, se sigue"

      - name: Guardar los datos (rama datos, sin historial para no crecer; historial y registro cifrados)
        env:
          ROBOT_PASS: ${{ secrets.ROBOT_PASS }}
        run: |
          python robot/privado.py cifrar data
          cd data
          git init -q -b datos
          git config user.name "robot-cashbet"
          git config user.email "robot-cashbet@users.noreply.github.com"
          git add -A
          git commit -q -m "datos $(date -u +%Y-%m-%dT%H:%MZ)"
          git push -q -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" datos
          rm -rf .git

      - name: Armar la app
        run: |
          mkdir -p _site/data
          cp -r web/* _site/
          rm -rf _site/data/*
          cp data/picks.json _site/data/
          cp data/estados.json data/sello.json data/noticias.json data/resultados.json data/previa.json data/odds.json _site/data/ 2>/dev/null || true
          cp -r data/img _site/data/ 2>/dev/null || true
          touch _site/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  publicar:
    needs: robot
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: https://cashbetapp.github.io/
    # GitHub a veces deja la publicación en su fila sin tomarla (estado vacío, nunca "syncing_files").
    # En vez de esperar 10 min y fallar, se pide de nuevo: hasta 4 intentos de 4 min con pausa entre ellos.
    steps:
      - id: deploy1
        uses: actions/deploy-pages@v4
        continue-on-error: true
        with: { timeout: 240000 }
      - if: steps.deploy1.outcome == 'failure'
        run: sleep 90
      - id: deploy2
        if: steps.deploy1.outcome == 'failure'
        uses: actions/deploy-pages@v4
        continue-on-error: true
        with: { timeout: 240000 }
      - if: steps.deploy2.outcome == 'failure'
        run: sleep 180
      - id: deploy3
        if: steps.deploy2.outcome == 'failure'
        uses: actions/deploy-pages@v4
        continue-on-error: true
        with: { timeout: 240000 }
      - if: steps.deploy3.outcome == 'failure'
        run: sleep 300
      - id: deploy
        if: steps.deploy3.outcome == 'failure'
        uses: actions/deploy-pages@v4
        with: { timeout: 300000 }
